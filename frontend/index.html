<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LM Agent Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">LM</div>
          <div>
            <h1>LM Agent</h1>
            <span>RAG Console</span>
          </div>
        </div>
        <nav class="nav" aria-label="Primary navigation">
          <button class="nav-item active" data-tab="overview">Overview</button>
          <button class="nav-item" data-tab="analysis">Analysis</button>
          <button class="nav-item" data-tab="knowledge">Knowledge</button>
          <button class="nav-item" data-tab="llmwiki">LLMWiki</button>
          <button class="nav-item" data-tab="documents">Documents</button>
          <button class="nav-item" data-tab="skills">Skills</button>
          <button class="nav-item" data-tab="chat">Chat</button>
          <button class="nav-item" data-tab="code">Code Assistant</button>
          <button class="nav-item" data-tab="admin">Admin</button>
          <button class="nav-item" data-tab="raw">API</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <strong id="activeTitle">Overview</strong>
            <span id="connectionLabel">http://127.0.0.1:8000/api/v1</span>
          </div>
          <div class="auth-strip">
            <label>
              Token
              <input id="tokenInput" autocomplete="off" />
            </label>
            <label>
              Request ID
              <input id="requestIdInput" autocomplete="off" />
            </label>
            <button id="newRequestIdBtn" class="icon-btn" title="New Request ID">R</button>
          </div>
        </header>

        <section id="globalAlert" class="alert" hidden></section>

        <section id="overview" class="tab-panel active"></section>
        <section id="analysis" class="tab-panel"></section>
        <section id="knowledge" class="tab-panel"></section>
        <section id="llmwiki" class="tab-panel"></section>
        <section id="documents" class="tab-panel"></section>
        <section id="skills" class="tab-panel"></section>
        <section id="chat" class="tab-panel"></section>
        <section id="code" class="tab-panel"></section>
        <section id="admin" class="tab-panel"></section>
        <section id="raw" class="tab-panel"></section>
      </main>
    </div>

    <script src="./vendor/echarts.min.js"></script>
    <script src="./dist/chart-runtime.js"></script>
    <script src="./echarts-adapter.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
