name: Windows Analysis Upgrade

on:
  push:
    branches:
      - codex/analysis-phase0-1-windows
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  analysis-upgrade:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint analysis upgrade changes
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          $output = & python -m ruff check --select E4,E7,E9,F --output-format concise `
            app/api/v1/analysis.py `
            app/core/config.py `
            app/core/constants.py `
            app/db/startup.py `
            app/models/analysis.py `
            app/schemas/analysis.py `
            app/schemas/analysis_recipe.py `
            app/services/analysis_chart_builder.py `
            app/services/analysis_filter_value_service.py `
            app/services/analysis_job_service.py `
            app/services/analysis_metrics_service.py `
            app/services/analysis_orchestrator_service.py `
            app/services/analysis_plan_normalizer.py `
            app/services/analysis_plan_repair_service.py `
            app/services/analysis_recipe_compiler.py `
            app/services/analysis_recipe_executor.py `
            app/services/analysis_recipe_registry.py `
            app/services/analysis_result_validator.py `
            app/services/dataset_query_service.py `
            app/services/spreadsheet_ingestion_service.py `
            tests/test_analysis_recipes_phase2_4.py `
            tests/test_analysis_intent_accuracy_p0_p2.py `
            tests/test_analysis_phase5_6.py `
            tests/test_analysis_plan_normalizer.py 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            $diagnostic = ($output | Select-Object -First 1).ToString()
            if ($diagnostic.Length -gt 70) {
              $diagnostic = $diagnostic.Substring(0, 70)
            }
            "diagnostic=$diagnostic" >> $env:GITHUB_OUTPUT
            exit $exitCode
          }

      - name: Run Windows analysis regressions
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_analysis_intent_accuracy_p0_p2.py `
            tests/test_analysis_phase5_6.py `
            tests/test_analysis_recipes_phase2_4.py `
            tests/test_analysis_plan_normalizer.py `
            tests/test_session_analysis_workspace.py `
            tests/test_workspace_phase2.py `
            tests/test_workspace_phase3_4.py

      - name: Publish observable commit statuses
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          LINT_DIAGNOSTIC: ${{ steps.lint.outputs.diagnostic }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $checks = @(
            @{ context = "windows/install"; result = $env:INSTALL_RESULT },
            @{ context = "windows/lint"; result = $env:LINT_RESULT },
            @{ context = "windows/tests"; result = $env:TEST_RESULT }
          )
          $failed = $false
          foreach ($check in $checks) {
            $state = if ($check.result -eq "success") { "success" } else { "failure" }
            if ($state -eq "failure") { $failed = $true }
            $context = $check.context
            if ($check.context -eq "windows/lint" -and $state -eq "failure" -and $env:LINT_DIAGNOSTIC) {
              $context = "windows/lint/$env:LINT_DIAGNOSTIC"
            }
            $body = @{
              state = $state
              context = $context
              description = "Windows analysis upgrade: $($check.result)"
            } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$env:REPOSITORY/statuses/$env:TARGET_SHA" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $body
          }
          if ($failed) { throw "One or more Windows analysis checks failed." }
