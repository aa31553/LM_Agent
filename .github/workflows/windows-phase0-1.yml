name: Windows Phase 0-1

on:
  push:
    branches:
      - codex/analysis-phase0-1-windows
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  phase0-1:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint Phase 0-1 changes
        shell: pwsh
        run: |
          python -m ruff check `
            app/core/constants.py `
            app/db/startup.py `
            app/models/analysis.py `
            app/schemas/analysis.py `
            app/services/analysis_orchestrator_service.py `
            app/services/analysis_plan_normalizer.py `
            app/services/analysis_plan_repair_service.py `
            tests/test_analysis_plan_normalizer.py

      - name: Run Windows compatibility regressions
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_analysis_plan_normalizer.py `
            tests/test_session_analysis_workspace.py

      - name: Publish observable commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RESULT: ${{ job.status }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $state = if ($env:CI_RESULT -eq "success") { "success" } else { "failure" }
          $description = "Windows Phase 0-1: $($env:CI_RESULT)"
          $body = @{
            state = $state
            context = "windows/phase0-1"
            description = $description
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:REPOSITORY/statuses/$env:TARGET_SHA" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body
