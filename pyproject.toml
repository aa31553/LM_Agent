[project]
name = "lm-agent"
version = "0.4.0"
description = "Enterprise AI Agent / RAG backend for internal document question answering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6,<0.2.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.4.4",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
]

[project.scripts]
lm-agent-init-db = "app.db.init_db:main"
lm-agent-db-doctor = "app.db.doctor:main"
lm-agent-llmwiki-reset = "app.cli.llmwiki:reset_main"
lm-agent-llmwiki-discover = "app.cli.llmwiki:discover_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*", "services*"]

[tool.setuptools.package-data]
app = [
    "default_skills/*/SKILL.md",
    "default_skills/*/agents/*.yaml",
    "static/docs/*",
]
"services.embedding_service" = [
    "static/docs/*",
]
